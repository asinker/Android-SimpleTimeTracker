name: Publish unsigned release

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
    paths:
      - '.github/workflows/github_release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v1.59.1

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Base Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Select release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$PUSH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.59.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run calendar drag tests
        run: ./gradlew :feature_records:testDebugUnitTest --stacktrace

      - name: Build unsigned Base Release
        run: ./gradlew :app:assembleBaseRelease --stacktrace

      - name: Prepare release files
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/base/release/app-base-release-unsigned.apk \
            dist/SimpleTimeTracker-1.59.1-calendar-release-unsigned.apk
          cd dist
          sha256sum SimpleTimeTracker-1.59.1-calendar-release-unsigned.apk \
            > SimpleTimeTracker-1.59.1-calendar-release-unsigned.apk.sha256
          cat > RELEASE_NOTES.md <<EOF
          ## Unofficial unsigned build / 非官方未签名版本

          This is an independently maintained, unofficial modification of
          [Razeeman/Android-SimpleTimeTracker](https://github.com/Razeeman/Android-SimpleTimeTracker).
          It is not affiliated with or endorsed by the upstream maintainers.

          本版本增加了日历时间块长按拖动、跨日期移动、边缘自动滚动、选中反馈和调整后撤销等功能。

          **The attached APK is unsigned and cannot be installed directly on Android.**
          It is provided for source-to-binary verification, archival, or signing with your own key.

          **附件 APK 未签名，不能直接在 Android 手机上安装。** 它仅用于存档、验证，或由下载者使用自己的密钥签名。

          Complete corresponding source is available from this release tag:
          https://github.com/${GITHUB_REPOSITORY}/tree/${RELEASE_TAG}

          The Android application and modifications remain licensed under GNU GPLv3 or later.
          See LICENSE.md and MODIFICATIONS.md in the tagged source.
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Simple Time Tracker 1.59.1 Calendar Drag (unsigned)" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease \
            dist/SimpleTimeTracker-1.59.1-calendar-release-unsigned.apk \
            dist/SimpleTimeTracker-1.59.1-calendar-release-unsigned.apk.sha256
