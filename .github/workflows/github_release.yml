name: Publish signed release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        default: v1.59.2

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Base Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Select release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$MANUAL_TAG"
          else
            RELEASE_TAG="$PUSH_TAG"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=SimpleTimeTracker-$RELEASE_VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run calendar drag tests
        run: ./gradlew :feature_records:testDebugUnitTest --stacktrace

      - name: Build Base Release
        run: ./gradlew :app:assembleBaseRelease --stacktrace

      - name: Sign and verify APK
        shell: bash
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          SIGNING_KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p dist
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/$APK_NAME" \
            app/build/outputs/apk/base/release/app-base-release-unsigned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "dist/$APK_NAME"

      - name: Prepare release files
        shell: bash
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd dist
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat > RELEASE_NOTES.md <<EOF
          ## Unofficial signed build / 非官方独立签名版本

          This is an independently maintained, unofficial modification of
          [Razeeman/Android-SimpleTimeTracker](https://github.com/Razeeman/Android-SimpleTimeTracker).
          It is not affiliated with or endorsed by the upstream maintainers.

          本版本包含完整的日历编辑增强：长按拖动、跨日期移动、边缘自动滚动、选中反馈、调整后撤销、
          相邻时间块结束点自动吸附，以及点击日历任意位置保存并结束编辑。

          **The attached APK is signed with this fork's independent release key and can be installed directly.**
          Its signature is not the upstream author's signature, so it cannot update an upstream installation in place.

          **附件 APK 使用本分支自己的发布证书签名，可以直接安装。** 它不能覆盖原作者签名的正式版；如有冲突，请先备份数据再卸载原版。

          Signing certificate SHA-256 / 签名证书指纹：
          7338BF172B19103F901E712ACE9C3A4CC0FD243AC45DC75F3A8BD96D9DE02709

          Complete corresponding source is available from this release tag:
          https://github.com/${GITHUB_REPOSITORY}/tree/${RELEASE_TAG}

          The Android application and modifications remain licensed under GNU GPLv3 or later.
          See LICENSE.md and MODIFICATIONS.md in the tagged source.
          EOF

      - name: Publish GitHub release
        shell: bash
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Simple Time Tracker $RELEASE_VERSION" \
              --notes-file dist/RELEASE_NOTES.md \
              --prerelease=false \
              --latest
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              "dist/$APK_NAME" "dist/$APK_NAME.sha256"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Simple Time Tracker $RELEASE_VERSION" \
              --notes-file dist/RELEASE_NOTES.md \
              --latest \
              "dist/$APK_NAME" "dist/$APK_NAME.sha256"
          fi
